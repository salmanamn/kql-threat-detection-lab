id: 18aee84a-398d-463b-844e-832ec0c45d12
name: SLZ-010 Federated credential added to or removed from a managed identity
description: |
  A federated identity credential was written to or deleted from a user-assigned managed identity.
  A federated credential lets an external token issuer (a GitHub repository, a Kubernetes service
  account) sign in as the identity without any secret, so adding one is a quiet way to keep access
  to everything the identity can do. Nobody is allowlisted, CI included: federated credentials are
  only created by the hand-applied bootstrap root, so every hit is either that apply (expected,
  confirm it) or persistence. Severity is raised to High when the target is a CI identity
  (id-slz-plan, id-slz-apply), which can deploy to the subscription. Role assignments to or by
  identities are covered by SLZ-001.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes: [AzureActivity]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [Persistence]
relevantTechniques: [T1098.001]
query: |
  AzureActivity
  | where CategoryValue == "Administrative"
  | where OperationNameValue in~ (
      "MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE",
      "MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/DELETE")
  | where ActivityStatusValue in~ ("Success", "Succeeded")
  | extend Target = tostring(Authorization_d.scope)
  | extend AlertSeverity = iff(Target contains "/userAssignedIdentities/id-slz-", "High", "Medium")
  | project TimeGenerated, Caller, CallerIpAddress, OperationNameValue, Target, AlertSeverity, CorrelationId
alertDetailsOverride:
  alertSeverityColumnName: AlertSeverity
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Target
version: 1.0.0

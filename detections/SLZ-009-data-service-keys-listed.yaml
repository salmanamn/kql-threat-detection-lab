id: 524e4d4d-e044-4a61-818a-e3a67e43ad70
name: SLZ-009 Data-service or Function keys listed outside CI
description: |
  Keys or connection strings of Service Bus, Cosmos DB, Event Grid, Azure OpenAI or Communication
  Services, or the host/function keys of a Function App, were retrieved or regenerated by a
  principal that is not CI or a known platform service. The ticket-triage stack is Entra-only
  (local auth disabled on every data service), so these keys have no legitimate use; azurerm
  refreshes and the code deploy list them, which is why CI is allowlisted. Severity is raised to
  High for Function App keys: the function key is the one key in the stack that still
  authenticates (it protects the ingest API). SLZ-003 covers storage and workspace keys.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes: [AzureActivity]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess]
relevantTechniques: [T1552]
query: |
  let allowed = KnownPrincipals() | where Role in ("ci", "platform") | project PrincipalId = tolower(PrincipalId);
  AzureActivity
  | where CategoryValue == "Administrative"
  | where OperationNameValue in~ (
      "MICROSOFT.SERVICEBUS/NAMESPACES/AUTHORIZATIONRULES/LISTKEYS/ACTION",
      "MICROSOFT.SERVICEBUS/NAMESPACES/AUTHORIZATIONRULES/REGENERATEKEYS/ACTION",
      "MICROSOFT.SERVICEBUS/NAMESPACES/QUEUES/AUTHORIZATIONRULES/LISTKEYS/ACTION",
      "MICROSOFT.SERVICEBUS/NAMESPACES/QUEUES/AUTHORIZATIONRULES/REGENERATEKEYS/ACTION",
      "MICROSOFT.DOCUMENTDB/DATABASEACCOUNTS/LISTKEYS/ACTION",
      "MICROSOFT.DOCUMENTDB/DATABASEACCOUNTS/READONLYKEYS/ACTION",
      "MICROSOFT.DOCUMENTDB/DATABASEACCOUNTS/LISTCONNECTIONSTRINGS/ACTION",
      "MICROSOFT.DOCUMENTDB/DATABASEACCOUNTS/REGENERATEKEY/ACTION",
      "MICROSOFT.EVENTGRID/TOPICS/LISTKEYS/ACTION",
      "MICROSOFT.EVENTGRID/TOPICS/REGENERATEKEY/ACTION",
      "MICROSOFT.COGNITIVESERVICES/ACCOUNTS/LISTKEYS/ACTION",
      "MICROSOFT.COGNITIVESERVICES/ACCOUNTS/REGENERATEKEY/ACTION",
      "MICROSOFT.COMMUNICATION/COMMUNICATIONSERVICES/LISTKEYS/ACTION",
      "MICROSOFT.COMMUNICATION/COMMUNICATIONSERVICES/REGENERATEKEY/ACTION",
      "MICROSOFT.WEB/SITES/HOST/LISTKEYS/ACTION",
      "MICROSOFT.WEB/SITES/FUNCTIONS/LISTKEYS/ACTION")
  | where ActivityStatusValue in~ ("Success", "Succeeded")
  | where tolower(Caller) !in (allowed)
  | extend Target = tostring(Authorization_d.scope)
  | summarize Count = count(), Operations = make_set(OperationNameValue), FunctionKeys = countif(OperationNameValue startswith "MICROSOFT.WEB/"),
      FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
      by Caller, CallerIpAddress, Target
  | extend AlertSeverity = iff(FunctionKeys > 0, "High", "Medium")
alertDetailsOverride:
  alertSeverityColumnName: AlertSeverity
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Target
version: 1.0.0
id: 9e47a0d2-1c6b-4f38-b5e9-0a7d3c2f6e84
name: SLZ-003 Storage or workspace keys listed outside CI
description: |
  Storage account keys, SAS tokens, or Log Analytics workspace shared keys were retrieved or
  regenerated by a principal that is not CI or a known platform service. The landing zone is
  Entra-only, so key material has no legitimate interactive use; azurerm refreshes list keys,
  which is why CI is allowlisted.
severity: Medium
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes: [AzureActivity]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [CredentialAccess]
relevantTechniques: [T1552]
query: |
  let allowed = KnownPrincipals() | where Role in ("ci", "platform") | project PrincipalId = tolower(PrincipalId);
  AzureActivity
  | where CategoryValue == "Administrative"
  | where OperationNameValue in~ (
      "MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTKEYS/ACTION",
      "MICROSOFT.STORAGE/STORAGEACCOUNTS/REGENERATEKEY/ACTION",
      "MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTACCOUNTSAS/ACTION",
      "MICROSOFT.STORAGE/STORAGEACCOUNTS/LISTSERVICESAS/ACTION",
      "MICROSOFT.OPERATIONALINSIGHTS/WORKSPACES/SHAREDKEYS/ACTION",
      "MICROSOFT.OPERATIONALINSIGHTS/WORKSPACES/REGENERATESHAREDKEY/ACTION")
  | where ActivityStatusValue in~ ("Success", "Succeeded")
  | where tolower(Caller) !in (allowed)
  | extend Target = tostring(Authorization_d.scope)
  | summarize Count = count(), Operations = make_set(OperationNameValue), FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
      by Caller, CallerIpAddress, Target
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Target
version: 1.0.0

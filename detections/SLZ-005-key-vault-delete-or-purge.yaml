id: 2e6b4d18-9f0a-4c37-8d52-6a1e3f7b0c95
name: SLZ-005 Key Vault deleted outside CI, or purge attempted
description: |
  A Key Vault was deleted by a non-CI principal (CI destroys the stack vault every lab session), or
  anyone attempted to purge a deleted vault. Purge protection makes purges fail, so failed purge
  attempts count too: the attempt is the signal.
severity: High
kind: Scheduled
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes: [AzureActivity]
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics: [Impact]
relevantTechniques: [T1485]
query: |
  let allowedIds = toscalar(KnownPrincipals() | where Role in ("ci", "platform") | summarize make_list(tolower(PrincipalId)));
  AzureActivity
  | where CategoryValue == "Administrative"
  | where OperationNameValue in~ ("MICROSOFT.KEYVAULT/VAULTS/DELETE", "MICROSOFT.KEYVAULT/LOCATIONS/DELETEDVAULTS/PURGE/ACTION")
  | extend IsPurge = OperationNameValue endswith "/PURGE/ACTION"
  | where (IsPurge and ActivityStatusValue !in~ ("Start", "Started", "Accept", "Accepted"))
       or (not(IsPurge) and ActivityStatusValue in~ ("Success", "Succeeded") and not(set_has_element(allowedIds, tolower(Caller))))
  | extend Scope = tostring(Authorization_d.scope)
  | project TimeGenerated, Caller, CallerIpAddress, OperationNameValue, ActivityStatusValue, IsPurge, Scope, CorrelationId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: Scope
version: 1.0.0

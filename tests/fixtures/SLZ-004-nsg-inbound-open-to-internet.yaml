cases:
  - name: security rule allows SSH from * -> alert
    expect: 1
    rows:
      AzureActivity:
        - {
            TimeGenerated: "2026-11-08T10:00:00Z",
            CategoryValue: Administrative,
            OperationNameValue: MICROSOFT.NETWORK/NETWORKSECURITYGROUPS/SECURITYRULES/WRITE,
            ActivityStatusValue: Start,
            Caller: attacker@contoso.example,
            CorrelationId: c-1,
            Authorization_d:
              {
                scope: /subscriptions/0/resourceGroups/rg-x/providers/Microsoft.Network/networkSecurityGroups/nsg-pe/securityRules/allow-ssh,
              },
            Properties_d:
              {
                requestbody: '{"properties":{"access":"Allow","direction":"Inbound","protocol":"Tcp","sourceAddressPrefix":"*","destinationPortRange":"22","priority":100}}',

cases:
  - name: human adds a federated credential to the CI apply identity -> alert, High
    expect: 1
    expect_values: { AlertSeverity: High }
    rows:
      AzureActivity:
        - TimeGenerated: "2026-11-14T10:00:00Z"
          CategoryValue: Administrative
          OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE
          ActivityStatusValue: Success
          Caller: attacker@contoso.example
          CallerIpAddress: 203.0.113.10
          CorrelationId: 22222222-0000-0000-0000-000000000001
          Authorization_d:
            {
              scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-slz-bootstrap/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-slz-apply/federatedIdentityCredentials/github-other-repo,
            }

  - name: human adds a federated credential to the triage app identity -> alert, Medium
    expect: 1
    expect_values: { AlertSeverity: Medium }
    rows:
      AzureActivity:
        - TimeGenerated: "2026-11-14T10:10:00Z"
          CategoryValue: Administrative
          OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE
          ActivityStatusValue: Succeeded
          Caller: attacker@contoso.example
          CallerIpAddress: 203.0.113.10
          CorrelationId: 22222222-0000-0000-0000-000000000002
          Authorization_d:
            {
              scope: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-triage-azure/providers/Microsoft.ManagedIdentity/userAssignedIdentities/id-triage-azure-app/federatedIdentityCredentials/backdoor,
            }

  - name: CI apply identity adds a credential to the CI plan identity (CI is not allowlisted) -> alert, High
    expect: 1
    expect_values: { AlertSeverity: High }
    rows:
      AzureActivity:
        - {
            TimeGenerated: "2026-11-14T10:20:00Z",
            CategoryValue: Administrative,
            OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE,
            ActivityStatusValue: Success,
            Caller: d39787e4-40ef-45e1-885a-37951a20698b,
            Authorization_d:
              {
                scope: /x/userAssignedIdentities/id-slz-plan/federatedIdentityCredentials/github-fork,
              },
          }

  - name: Start + Success of one write, then its delete -> two alerts
    expect: 2
    rows:
      AzureActivity:
        - {
            TimeGenerated: "2026-11-14T10:30:00Z",
            CategoryValue: Administrative,
            OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE,
            ActivityStatusValue: Start,
            Caller: attacker@contoso.example,
            Authorization_d:
              {
                scope: /x/userAssignedIdentities/id-triage-azure-app/federatedIdentityCredentials/temp,
              },
          }
        - {
            TimeGenerated: "2026-11-14T10:30:02Z",
            CategoryValue: Administrative,
            OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE,
            ActivityStatusValue: Success,
            Caller: attacker@contoso.example,
            Authorization_d:
              {
                scope: /x/userAssignedIdentities/id-triage-azure-app/federatedIdentityCredentials/temp,
              },
          }
        - {
            TimeGenerated: "2026-11-14T10:40:00Z",
            CategoryValue: Administrative,
            OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/DELETE,
            ActivityStatusValue: Success,
            Caller: attacker@contoso.example,
            Authorization_d:
              {
                scope: /x/userAssignedIdentities/id-triage-azure-app/federatedIdentityCredentials/temp,
              },
          }

  - name: failed write -> no alert
    expect: 0
    rows:
      AzureActivity:
        - {
            TimeGenerated: "2026-11-14T10:50:00Z",
            CategoryValue: Administrative,
            OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/FEDERATEDIDENTITYCREDENTIALS/WRITE,
            ActivityStatusValue: Failure,
            Caller: attacker@contoso.example,
          }

  - name: CI creates the identity itself (stack apply) -> no alert
    expect: 0
    rows:
      AzureActivity:
        - {
            TimeGenerated: "2026-11-14T11:00:00Z",
            CategoryValue: Administrative,
            OperationNameValue: MICROSOFT.MANAGEDIDENTITY/USERASSIGNEDIDENTITIES/WRITE,
            ActivityStatusValue: Success,
            Caller: d39787e4-40ef-45e1-885a-37951a20698b,
            Authorization_d:
              { scope: /x/userAssignedIdentities/id-triage-azure-app },
          }
